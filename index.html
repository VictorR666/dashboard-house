<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Maison</title>
<meta name="theme-color" content="#FDFCFF">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maison">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-round.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-round-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="fonts/nunito-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=46">
</head>
<body>

<div class="wrap">
  <header class="head">
    <div class="mascot"><img src="assets/kimchi-anim.svg" alt="Kimchi, tout content" width="300" height="300"></div>
    <div>
      <div class="date" id="today"></div>
      <h1 id="hello" aria-live="off">--:--</h1>
    </div>
    <div class="weather" id="weather" hidden></div>
    <div id="banner"></div>
  </header>

  <div class="viewsw seg" role="group" aria-label="Affichage de l'accueil"><button type="button" data-act="view-set" data-v="simple">Vue simple</button><button type="button" data-act="view-set" data-v="detail">Vue détaillée</button></div>
  <main class="grid">
    <section class="card s-main"><div class="ch"><span class="ic lav"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg></span><h2>Aujourd'hui</h2></div><div class="body" id="l-main"></div></section>
    <section class="card s-proj"><div class="ch"><span class="ic peach"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-3 3-6-6z"/><path d="M12.5 10.5L4 19"/></svg></span><h2><button class="h2btn" type="button" data-act="qview-open" title="Voir toutes les quêtes">Quêtes secondaires<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></h2><button class="mini" data-act="add-toggle" aria-label="Ajouter une quête" title="Ajouter">+</button></div><form id="f-add" class="addform" hidden><input class="in" id="a-title" required maxlength="80" placeholder="Une idée ?" aria-label="Nouvelle idée"><button class="btn" type="submit">OK</button><button class="btn ghost" type="button" data-act="add-detail" title="Ajouter et compléter les détails" aria-label="Ajouter et compléter les détails"><svg class="ico-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></button></form><div class="body tg" id="l-todo"></div></section>
    <section class="card s-cal"><div class="ch"><span class="ic lav"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="14" rx="3"/><path d="M4 11h16M8 3v4M16 3v4"/></svg></span><h2>À venir</h2><a class="mini ico" href="https://calendar.google.com/calendar/u/0/r/week" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir Google Agenda" title="Google Agenda"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></a></div><button class="tripnext" id="trip-next" type="button" data-act="trip-open" hidden></button><div class="body" id="l-cal"></div><div class="seg calr" id="cal-r" hidden></div></section>
    <section class="card s-courses"><div class="ch"><span class="ic mint"><svg viewBox="0 0 24 24"><path d="M4 5h2l2 10h10l2-7H7"/><circle cx="9.5" cy="19" r="1.3"/><circle cx="16.5" cy="19" r="1.3"/></svg></span><h2><button class="h2btn" type="button" data-act="cview-open" title="Ouvrir la liste en plein écran">Courses<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button> <small class="h2sub" id="c-count"></small></h2><button class="mini" data-act="course-toggle" aria-label="Ajouter un article" title="Ajouter">+</button></div><form id="f-course" class="addform" autocomplete="off" hidden><input class="in" id="c-title" required maxlength="80" enterkeyhint="done" placeholder="Ajouter…" aria-label="Ajouter à la liste de courses"><button class="btn" type="submit">OK</button></form><div class="body" id="l-courses"></div></section>
    <section class="card s-todoall"><div class="ch"><span class="ic peach"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg></span><h2>À faire</h2><small class="h2sub" id="ta-count"></small></div><div class="body" id="l-todoall"></div></section>
    <section class="card s-kimchi minor"><div class="ch"><span class="ic lav"><svg viewBox="0 0 24 24"><circle cx="6.5" cy="10" r="1.8" fill="currentColor"/><circle cx="10.5" cy="6.5" r="1.8" fill="currentColor"/><circle cx="15.5" cy="6.5" r="1.8" fill="currentColor"/><circle cx="19" cy="10" r="1.8" fill="currentColor"/><path d="M12.8 11.5c-3 0-5.2 2.4-4.4 4.8.5 1.5 1.8 2.2 4.4 2.2s3.9-.7 4.4-2.2c.8-2.4-1.4-4.8-4.4-4.8z" fill="currentColor"/></svg></span><h2>Kimchi</h2><button class="mini" data-act="care-add" data-group="Kimchi" aria-label="Ajouter une tâche" title="Ajouter">+</button></div><form class="addform care-add" data-group="Kimchi" hidden><input class="in" required maxlength="80" placeholder="Nouvelle tâche" aria-label="Nouvelle tâche pour Kimchi"><button class="btn" type="submit">OK</button><button class="btn ghost" type="button" data-act="add-detail" title="Ajouter et compléter les détails" aria-label="Ajouter et compléter les détails"><svg class="ico-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></button></form><div class="body" id="l-Kimchi"></div></section>
    <section class="card s-plantes minor"><div class="ch"><span class="ic mint"><svg viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14z"/><path d="M5 19L13 11"/></svg></span><h2>Plantes</h2><button class="mini" data-act="care-add" data-group="Plantes" aria-label="Ajouter une plante" title="Ajouter">+</button></div><form class="addform care-add" data-group="Plantes" hidden><input class="in" required maxlength="80" placeholder="Nom de la plante" aria-label="Nouvelle plante"><button class="btn" type="submit">OK</button><button class="btn ghost" type="button" data-act="add-detail" title="Ajouter et compléter les détails" aria-label="Ajouter et compléter les détails"><svg class="ico-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></button></form><div class="body" id="l-Plantes"></div></section>
    <section class="card s-maison minor"><div class="ch"><span class="ic peach"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></span><h2>Entretien Maison</h2><button class="mini" data-act="care-add" data-group="Maison" aria-label="Ajouter une tâche" title="Ajouter">+</button></div><form class="addform care-add" data-group="Maison" hidden><input class="in" required maxlength="80" placeholder="Nouvelle tâche" aria-label="Nouvelle tâche pour l'entretien de la maison"><button class="btn" type="submit">OK</button><button class="btn ghost" type="button" data-act="add-detail" title="Ajouter et compléter les détails" aria-label="Ajouter et compléter les détails"><svg class="ico-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></button></form><div class="body" id="l-Maison"></div></section>
    <section class="card s-wish"><div class="ch"><span class="ic peach"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg></span><h2>Wishlist</h2><span class="wtot" id="w-total"></span><button class="mini" data-act="wishq-toggle" aria-label="Ajouter une envie" title="Ajouter">+</button></div><form id="f-wish" class="addform" hidden><input class="in" id="w-title" required maxlength="80" placeholder="Une envie ?" aria-label="Nouvelle envie"><button class="btn" type="submit">OK</button><button class="btn ghost" type="button" data-act="add-detail" title="Compléter les détails" aria-label="Compléter les détails"><svg class="ico-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></button></form><div class="body wchips" id="l-wish"></div></section>
    <section class="card s-voyage"><div class="ch"><span class="ic peach"><svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="2.5"/><path d="M9 8V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V8M9 12v4M15 12v4"/></svg></span><h2>Voyages</h2><button class="mini" data-act="trip-new" aria-label="Nouveau voyage" title="Nouveau voyage">+ Nouveau</button></div><div class="body" id="l-voyages"></div></section>
  </main>
  <div id="hub" class="hub" aria-label="Accueil en raccourcis (test)"></div>
</div>
<nav class="tabbar" aria-label="Sections">
  <button type="button" data-act="tab" data-tab="home" aria-label="Accueil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Accueil</span></button>
  <button type="button" data-act="tab" data-tab="maison" aria-label="Routines"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.5-4.6L4 8M4 3.5V8h4.5"/><path d="M4 13a8 8 0 0 0 14.5 4.6L20 16m0 4.5V16h-4.5"/><path d="M9 12l2 2 4-4"/></svg><span>Routines</span></button>
  <button type="button" data-act="tab" data-tab="courses" aria-label="Courses et wishlist"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l2 10h10l2-7H7"/><circle cx="9.5" cy="19" r="1.3"/><circle cx="16.5" cy="19" r="1.3"/></svg><span>Courses</span></button>
  <button type="button" data-act="tab" data-tab="voyage" aria-label="Voyages"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="2.5"/><path d="M9 8V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V8M9 12v4M15 12v4"/></svg><span>Voyages</span></button>
</nav>
<div class="foot"><button class="lnk" type="button" data-act="logout">Déconnecter cet appareil</button></div>
<section id="qview" class="qview" hidden aria-label="Toutes les quêtes">
  <div class="qv-in">
    <header class="qv-head">
      <button class="qv-back" type="button" data-act="qview-close" aria-label="Retour au dashboard">‹</button>
      <div class="qv-tt"><h2>Quêtes</h2><small id="qv-count"></small></div>
      <button class="mini" type="button" data-act="qadd-toggle" aria-label="Ajouter une quête" title="Ajouter">+ Nouvelle</button>
    </header>
    <form id="f-qadd" class="addform" hidden><input class="in" id="q-title" required maxlength="80" placeholder="Une idée ?" aria-label="Nouvelle quête"><button class="btn" type="submit">Ajouter</button></form>
    <div id="qv-list" class="qv-list"></div>
  </div>
</section>
<section id="cview" class="qview cview" hidden aria-label="Liste de courses">
  <div class="qv-in">
    <header class="qv-head">
      <button class="qv-back" type="button" data-act="cview-close" aria-label="Retour au dashboard">‹</button>
      <div class="qv-tt"><h2>Courses</h2><small id="cv-count"></small></div>
      <span id="cv-net" class="cv-net" hidden></span>
    </header>
    <form id="f-course2" class="addform cv-add" autocomplete="off"><input class="in" id="c-title2" required maxlength="80" enterkeyhint="done" placeholder="Ajouter…" aria-label="Ajouter à la liste de courses"><button class="btn" type="submit">OK</button></form>
    <div id="cv-list" class="cv-list"></div>
  </div>
</section>
<section id="vview" class="qview vview" hidden aria-label="Voyage">
  <div class="qv-in">
    <header class="qv-head">
      <button class="qv-back" type="button" data-act="vview-close" aria-label="Retour aux voyages">‹</button>
      <div class="qv-tt"><h2 id="vv-title"></h2><small id="vv-sub"></small></div>
      <button class="mini vv-bil" id="vv-bil" type="button" data-act="bil-open" aria-haspopup="dialog">🎟️ Billets</button>
    </header>
    <div id="vv-body" class="vv-body"></div>
  </div>
</section>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<div id="login" class="login" hidden>
  <form class="login-card" id="login-form" autocomplete="off">
    <img src="assets/kimchi.svg" alt="">
    <h2>Maison</h2>
    <p>Entre le code d'accès de la maison.<br>Il ne sera demandé qu'une fois sur cet appareil.</p>
    <input class="in" id="login-url" type="url" inputmode="url" placeholder="Adresse du script (https://script.google.com/…)" aria-label="Adresse du script" hidden>
    <input class="in" id="login-code" type="password" required minlength="8" maxlength="200" placeholder="Code d'accès" aria-label="Code d'accès" autocomplete="current-password">
    <div class="login-err" id="login-err" role="alert"></div>
    <button class="btn" type="submit" id="login-go">Entrer</button>
  </form>
</div>

<script src="app.js?v=46"></script>
</body>
</html>
